spring:
  application:
    name: flight-booking-api

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flight_booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:root}"

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

server:
  port: "${SERVER_PORT:8080}"

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION:86400000}"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    se.lexicon.flightbooking_api: INFO
    org.springframework.jdbc.datasource.init: INFO