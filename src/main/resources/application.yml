spring:
  application:
    name: flight-booking-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  jackson:
    time-zone: UTC

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-5-mini}

openai:
  enabled: ${OPENAI_ENABLED:false}

assistant:
  history:
    max-messages: ${ASSISTANT_HISTORY_MAX_MESSAGES:16}
    ttl: ${ASSISTANT_HISTORY_TTL:30m}
  actions:
    ttl: ${ASSISTANT_ACTION_TTL:5m}

server:
  address: 0.0.0.0
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${FRONTEND_URLS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    se.lexicon.flightbooking_api: INFO