spring:
  application:
    name: flight-booking-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  jackson:
    time-zone: UTC

openai:
    enabled: ${OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
    timeout: ${OPENAI_TIMEOUT:30s}
    max-retries: ${OPENAI_MAX_RETRIES:1}

assistant:
  history:
    max-messages: ${ASSISTANT_HISTORY_MAX_MESSAGES:16}
    ttl: ${ASSISTANT_HISTORY_TTL:30m}

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    se.lexicon.flightbooking_api: INFO
    org.springframework.jdbc.datasource.init: INFO